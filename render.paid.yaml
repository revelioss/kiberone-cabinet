# Платный тариф после пробного месяца. Сайт не засыпает, база не удаляется.
# Сайт 0.5 CPU / 512 МБ — $7/мес. Postgres 0.1 CPU / 256 МБ — $6/мес.
# Диск базы 1 ГБ — $0.30/мес. Итого около $13.30 в месяц.
# Подключайте этот файл в настройках Blueprint (Blueprint Path) только после
# смены планов в панели Render. Иначе следующий деплой вернёт сервисы на free.
services:
  - type: web
    name: kiberone-cabinet
    runtime: node
    plan: 0.5c-512mb
    region: frankfurt
    branch: main
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy && npx tsx prisma/seed.ts
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: kiberone-db
          property: connectionString
      - key: ALFACRM_HOST
        value: kiberonekaraganda.s20.online
      - key: ALFACRM_BRANCH_ID
        value: "1"
      - key: ALFACRM_EMAIL
        sync: false
      - key: ALFACRM_API_KEY
        sync: false
      - key: ALFACRM_MOCK
        value: "1"
      - key: ADMIN_LOGIN
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: SYNC_INTERVAL_MINUTES
        value: "360"
      - key: SYNC_MAX_AGE_HOURS
        value: "6"
      - key: SEED_DEMO
        value: "0"
      - key: SHOW_DEMO_LOGINS
        value: "0"

databases:
  - name: kiberone-db
    plan: 0.1c-256mb
    region: frankfurt
    diskSizeGB: 1
    databaseName: cabinet
    user: cabinet
