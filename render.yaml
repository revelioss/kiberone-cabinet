# Пробный запуск без карты, около 30 дней.
# Сайт и Postgres на плане free. После пробного срока перейдите на render.paid.yaml
# до 30-го дня, иначе база станет недоступна, а ещё через 14 дней Render её удалит.
# Бесплатный сайт засыпает через 15 минут без заходов, поэтому SYNC_INTERVAL_MINUTES=0.
# Синхронизация идёт по кнопке в админке и при входе, если прошло больше SYNC_MAX_AGE_HOURS.
services:
  - type: web
    name: kiberone-cabinet
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npx tsx prisma/seed.ts && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: kiberone-db
          property: connectionString
      - key: ALFACRM_HOST
        value: kiberonekaraganda.s20.online
      - key: ALFACRM_BRANCH_ID
        value: "1"
      - key: ALFACRM_EMAIL
        sync: false
      - key: ALFACRM_API_KEY
        sync: false
      - key: ALFACRM_MOCK
        value: "1"
      - key: ADMIN_LOGIN
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: SYNC_INTERVAL_MINUTES
        value: "0"
      - key: SYNC_MAX_AGE_HOURS
        value: "6"
      - key: SEED_DEMO
        value: "0"
      - key: SHOW_DEMO_LOGINS
        value: "0"

databases:
  - name: kiberone-db
    plan: free
    region: frankfurt
    databaseName: cabinet
    user: cabinet
