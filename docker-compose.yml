services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cabinet
      POSTGRES_PASSWORD: cabinet
      POSTGRES_DB: cabinet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cabinet -d cabinet"]
      interval: 5s
      timeout: 5s
      retries: 20

  cabinet:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4317:4317"
    environment:
      DATABASE_URL: postgresql://cabinet:cabinet@db:5432/cabinet
      SEED_DEMO: "1"
      ADMIN_LOGIN: admin
      ADMIN_PASSWORD: Kabinet-Admin-2026
      ALFACRM_HOST: kiberonekaraganda.s20.online
      ALFACRM_BRANCH_ID: "1"
      ALFACRM_MOCK: "1"
      SYNC_INTERVAL_MINUTES: "0"
      CRON_SECRET: demo-cron-secret
    restart: unless-stopped

volumes:
  pgdata:
